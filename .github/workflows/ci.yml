name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@u5
        with:
          enable-cache: true
          python-version: "3.12"
      
      - name: Install dependencies
        run: uv sync

      - name: Run pytest suite
        run: uv run pytest -v